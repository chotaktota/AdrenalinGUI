name: Публикация релиза

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Сборка и тесты
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Тег релиза должен иметь формат vX.Y.Z' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          ./gradlew --no-daemon clean build "-PreleaseVersion=$version"
          test -s "build/libs/AdrenalinGUI-$version.jar"
      - name: Публикация на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" "build/libs/AdrenalinGUI-$version.jar" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "AdrenalinGUI $RELEASE_TAG" --generate-notes
