<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">From a Kotlin layout to independent player inventories</title>
<desc id="desc">The DSL compiles into a cached template. Each opening clones the template into an independent inventory for that player.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2d"/><stop offset="1" stop-color="#0a111c"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#55dfcb" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="360" rx="24" fill="url(#bg)"/>
<text x="48" y="52" fill="#c8d7eb" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">CACHE ONCE · OPEN INDEPENDENTLY</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="130" width="250" height="130" rx="16" fill="#16283e" stroke="#446584"/>
<text x="72" y="170" fill="#edf5ff" font-size="24" font-weight="bold">Kotlin layout</text>
<text x="72" y="204" fill="#9aafc9" font-size="16">Patterns · text · click handlers</text>
<text x="72" y="232" fill="#a897f7" font-size="15">onUpdateNodes()</text>
<path d="M310 195H378" fill="none" stroke="#55dfcb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="392" y="130" width="290" height="130" rx="16" fill="#133436" stroke="#43bfb0"/>
<text x="416" y="170" fill="#edf5ff" font-size="24" font-weight="bold">Cached template</text>
<text x="416" y="204" fill="#acd4d1" font-size="16">Text templates · items · actions</text>
<text x="416" y="232" fill="#55dfcb" font-size="15">Rebuilt after invalidation</text>
<path d="M694 195H736V128H790M736 195V270H790" fill="none" stroke="#55dfcb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="808" y="82" width="342" height="94" rx="16" fill="#16283e" stroke="#446584"/>
<text x="832" y="119" fill="#edf5ff" font-size="22" font-weight="bold">Player A inventory</text>
<text x="832" y="150" fill="#9aafc9" font-size="16">Cloned items · resolved text</text>
<rect x="808" y="224" width="342" height="94" rx="16" fill="#16283e" stroke="#446584"/>
<text x="832" y="261" fill="#edf5ff" font-size="22" font-weight="bold">Player B inventory</text>
<text x="832" y="292" fill="#9aafc9" font-size="16">Cloned items · resolved text</text>
</g></svg>
